<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Auragen - Aura Generator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#241a33 0%,#120d1c 60%);color:#e6dbff;font-family:"Inter",-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:44px 16px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:42px;margin:0;letter-spacing:.01em}
.tag{color:#8d7fae;font-family:"Inter",sans-serif;letter-spacing:.22em;font-size:10.5px;margin:10px 0 18px;text-transform:uppercase}
.orb{width:190px;height:190px;border-radius:50%;margin:16px 0;transition:all 1s;background:radial-gradient(circle at 35% 35%,#3d2a5e,#1a1230);box-shadow:0 0 60px #3d2a5e66;border:1px solid rgba(255,255,255,.07)}
.orb.live{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hud{color:#8d7fae;font-size:11px;letter-spacing:.14em;margin:10px 0 20px;text-transform:uppercase}
.hud b{color:#d9c6ff;font-weight:600}
input{background:transparent;border:none;border-bottom:1px solid #453563;color:#e6dbff;padding:10px 4px;width:320px;font-family:"Inter",sans-serif;font-size:14px;text-align:left;transition:border-color .2s}
input::placeholder{color:#6c5f8c;font-style:italic}
input:focus{outline:none;border-bottom-color:#c9a0ff}
.moods{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:360px;margin:16px 0}
.mood{background:transparent;border:1px solid #453563;color:#b7a3dd;border-radius:99px;padding:7px 14px;font-family:"Inter",sans-serif;font-size:11px;letter-spacing:.06em;cursor:pointer;transition:.15s}
.mood:hover{border-color:#8d7fae}
.mood.sel{background:#d9c6ff;color:#171021;border-color:#d9c6ff}
button{background:transparent;border:1px solid #6b5594;color:#d9c6ff;border-radius:99px;padding:12px 28px;font-family:"Inter",sans-serif;letter-spacing:.24em;font-size:11px;cursor:pointer;margin-top:8px;text-transform:uppercase;transition:.2s}
button:hover{background:#d9c6ff;color:#171021;border-color:#d9c6ff}
.reading{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-left:2px solid #c9a0ff;border-radius:6px;padding:18px 20px;width:340px;margin-top:20px;display:none}
.reading .an{font-family:"Cormorant Garamond",Georgia,serif;color:#efe6ff;font-size:24px;letter-spacing:.06em}
.reading .ar{font-family:"Cormorant Garamond",Georgia,serif;color:#b9a6d6;font-size:16.5px;line-height:1.55;margin-top:8px;font-style:italic}
.hist{color:#6c5f8c;font-size:9.5px;letter-spacing:.18em;margin-top:18px}
</style></head><body>
<h1>Auragen</h1><div class="tag">make ur own aura &middot; science(ish)</div>
<div class="orb" id="orb"></div>
<div class="hud">Auras crafted <b id="sA">0</b></div>
<input id="nm" placeholder="your name (the aura needs to know)" maxlength="20">
<div class="moods" id="moods"></div>
<button onclick="gen()">Generate my aura</button>
<div class="reading" id="reading"></div>
<div class="hist" id="hist"></div>
<script>
const MOODS=['calm','wired','sleepy','feral','hopeful','gremlin','focused','mysterious'];
const C1={calm:'#7ec8ff',wired:'#ffe066',sleepy:'#9d8cff',feral:'#ff7e5f',hopeful:'#8dffb0',gremlin:'#b0ff5f',focused:'#5ff2ff',mysterious:'#c9a0ff'};
const C2={calm:'#2b5b8c',wired:'#8c5f2b',sleepy:'#3a2f6e',feral:'#8c2b3a',hopeful:'#2b8c55',gremlin:'#4a8c2b',focused:'#2b7a8c',mysterious:'#4a2b6e'};
const ADJ={calm:'Low Tide',wired:'Static',sleepy:'Velvet',feral:'Wildfire',hopeful:'First Light',gremlin:'Moss',focused:'Laser',mysterious:'Fog'};
const NOUN=['Static','Signal','Weather','Honey','Voltage','Marble','Pollen','Mercury'];
const LINES=['people feel it when you walk in, they just cannot name it.','it hums at a frequency only dogs and old friends notice.','it is strongest right before you laugh.','it recharges in grocery store aisles at night.','it once fixed a vending machine by standing near it.','strangers tell you things. this is why.','it pairs well with loud music and open windows.','it has been described as "a lot, but fondly".'];
let D=JSON.parse(localStorage.getItem('auragen')||'{"count":0,"names":[]}');let sel='calm';
const mc=document.getElementById('moods');
mc.innerHTML=MOODS.map(m=>`<span class="mood${m===sel?' sel':''}" data-m="${m}">${m}</span>`).join('');
mc.onclick=e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m)return;sel=m;
[...mc.children].forEach(c=>c.classList.toggle('sel',c.dataset.m===m));};
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function gen(){const nm=document.getElementById('nm').value.trim()||'nameless one';
const h=hash(nm+sel+Date.now().toString(36).slice(-3));
const c1=C1[sel],c2=C2[sel];
const orb=document.getElementById('orb');
orb.style.background=`radial-gradient(circle at 35% 35%, ${c1}, ${c2} 70%)`;
orb.style.boxShadow=`0 0 80px ${c1}88, 0 0 140px ${c2}55`;
orb.classList.add('live');
const an=ADJ[sel]+' '+NOUN[h%NOUN.length];
const r=document.getElementById('reading');r.style.display='block';
r.innerHTML=`<div class="an">${an.toUpperCase()}</div><div class="ar">${nm}, your aura reads ${an.toLowerCase()} — ${LINES[h%LINES.length]}</div>`;
D.count++;D.names.unshift(an);D.names=D.names.slice(0,6);
document.getElementById('sA').textContent=D.count;
document.getElementById('hist').textContent=D.names.length?'PREVIOUSLY: '+D.names.join(' · ').toUpperCase():'';
localStorage.setItem('auragen',JSON.stringify(D));}
document.getElementById('sA').textContent=D.count;
</script>
</body>
</html>
